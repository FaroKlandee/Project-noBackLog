# CI — lints the frontend and runs both test suites on every push.
#
# Three independent jobs, run in parallel on separate runners:
#   - backend:  `dotnet test` over backend-tests/ (xUnit, in-memory SQLite —
#               no Postgres service needed).
#   - frontend: `pnpm lint` (Biome format + lint), `pnpm test:coverage` (Vitest +
#               MSW — no backend needed; fails under the coverage thresholds), then `pnpm build` to catch anything
#               that only breaks the bundle.
#   - e2e:      `pnpm test:e2e` (Playwright, real pointer and keyboard drags in
#               Chromium against the Vite dev server — the API is stubbed, so no
#               backend needed).

name: CI

on:
  push:
  # Lets a run be started by hand from the Actions tab.
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (xUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Builds backend-dotnet/ too, via the test project's ProjectReference.
      - name: Test
        run: dotnet test backend-tests --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint (Biome) + tests (Vitest) + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in frontend/package.json's
      # `packageManager` field, so CI and local installs match.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile fails instead of silently updating the lockfile if it
      # is out of sync with package.json.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on formatting drift as well as lint rules (`biome check`).
      - name: Lint
        run: pnpm lint

      # Runs with coverage so the thresholds in vite.config.js are enforced.
      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: Browser drag-and-drop tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium and the system libraries it needs on the runner.
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test:e2e

      # The HTML report and the retry's trace, for debugging a failed drag.
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
